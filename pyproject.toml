[build-system]
requires = [
    "setuptools>=77; python_version >= '3.9'",
    "setuptools<77; python_version < '3.9'",
]
build-backend = "setuptools.build_meta"

[project]
name = "himalayas"
dynamic = ["version"]
description = "Enrichment-based annotation and visualization of hierarchically clustered matrices"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"

authors = [
    { name = "Ira Horecka" }
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
]

keywords = [
    "hierarchical-clustering",
    "enrichment-analysis",
    "gene-ontology",
    "heatmap",
    "dendrogram",
    "bioinformatics",
    "data-visualization",
    "multiple-testing-correction",
]

dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "typing_extensions; python_version < '3.10'",
]

[project.optional-dependencies]
text = ["nltk"]
speed = ["fastcluster"]

[project.urls]
Homepage = "https://github.com/himalayas-base/himalayas"
Repository = "https://github.com/himalayas-base/himalayas"
Documentation = "https://himalayas-base.github.io/himalayas-docs/"
Issues = "https://github.com/himalayas-base/himalayas/issues"

[tool.setuptools.dynamic]
version = { attr = "himalayas.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "api: public API tests",
    "unit: unit tests",
    "slow: slow or integration tests",
]
