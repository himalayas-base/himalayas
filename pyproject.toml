[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "himalayas"
dynamic = ["version"]
description = "Enrichment-based annotation and visualization of hierarchically clustered matrices"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.8"

authors = [
    { name = "Ira Horecka" }
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]

keywords = [
    "hierarchical clustering",
    "matrix visualization",
    "enrichment analysis",
    "annotations",
]

dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "typing_extensions; python_version < '3.10'",
]

[project.optional-dependencies]
text = ["nltk"]
speed = ["fastcluster"]

[project.urls]
Homepage = "https://github.com/himalayas-base/himalayas"
Repository = "https://github.com/himalayas-base/himalayas"
Documentation = "https://himalayas-base.github.io/himalayas-docs/"
Issues = "https://github.com/himalayas-base/himalayas/issues"

[tool.setuptools.dynamic]
version = { attr = "himalayas.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "api: public API tests",
    "unit: unit tests",
    "slow: slow or integration tests",
]
